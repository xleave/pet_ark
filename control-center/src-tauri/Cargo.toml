[package]
name = "pet-ark-control-center"
version = "0.4.0"
description = "Native control center for the Pet Ark Wayland desktop pet"
authors = ["xleave"]
edition = "2021"

[lib]
name = "pet_ark_control_center_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = true }
base64 = "0.22"
